<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="vinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2b2b2b"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="label" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E3CB85"/>
      <stop offset="55%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8C6D14"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- disc -->
  <circle cx="32" cy="32" r="31" fill="url(#vinyl)" stroke="#000000" stroke-width="1"/>

  <!-- grooves -->
  <g fill="none" stroke="#3a3a3a" stroke-width="0.7" opacity="0.7">
    <circle cx="32" cy="32" r="27"/>
    <circle cx="32" cy="32" r="24"/>
    <circle cx="32" cy="32" r="21"/>
    <circle cx="32" cy="32" r="18"/>
    <circle cx="32" cy="32" r="15"/>
  </g>

  <!-- light sheen -->
  <circle cx="32" cy="32" r="31" fill="url(#sheen)"/>

  <!-- center label -->
  <circle cx="32" cy="32" r="11" fill="url(#label)"/>
  <circle cx="32" cy="32" r="11" fill="none" stroke="#6E5410" stroke-width="1"/>

  <!-- spindle hole -->
  <circle cx="32" cy="32" r="2.4" fill="#0a0a0a"/>
</svg>
